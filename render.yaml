services:
  - type: web
    name: summit-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm --prefix functions install --include=dev && npm --prefix functions run build
    startCommand: npm --prefix functions start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
